[pytest]
# Scope collection to tests/ only. Without this, a bare `pytest -q` run
# from the project root also matches and IMPORTS the root-level
# test_phase*.py / test_schemas2.py scripts (they fit the test_*.py glob),
# which executes their entire top-level script body as a side effect of
# collection — including real model retraining and real predictions
# outside any pytest fixture, so the audit-log redirection in
# tests/conftest.py never applies to them and they can write to the real
# logs/ directory. Those scripts are still runnable directly
# (e.g. `python test_phase7.py`); they are just not pytest's concern.
testpaths = tests
